name: Tests

on:
  push:
    # The Command Center is a self-contained Next.js app with its own tooling;
    # the Python suite has nothing to say about it, so don't run (and fail) on
    # frontend-only changes.
    paths-ignore: ["command-center/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["command-center/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m unittest discover tests -v
